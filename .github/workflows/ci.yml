name: CI

# 快速验证流水线：push / PR 时只构建 Linux 核心二进制（不含 Qt），
# 约 5 分钟反馈代码能否编译。完整三平台构建（含 Qt 钱包）由 release.yml 在打 tag 时执行。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-linux:
    name: Linux build check (core, no Qt)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 libssl-dev libevent-dev \
            libboost-system-dev libboost-filesystem-dev libboost-chrono-dev \
            libboost-program-options-dev libboost-test-dev libboost-thread-dev \
            libdb++-dev libminiupnpc-dev libzmq3-dev libprotobuf-dev protobuf-compiler

      - name: Build
        run: |
          ./autogen.sh
          ./configure --without-gui --with-incompatible-bdb --disable-zmq --disable-tests
          make -j$(nproc)

      - name: Verify binaries
        run: |
          test -f src/dragonchaind && echo "dragonchaind OK"
          test -f src/dragonchain-cli && echo "dragonchain-cli OK"
          test -f src/dragonchain-tx && echo "dragonchain-tx OK"
