name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 libssl-dev libevent-dev \
            libboost-system-dev libboost-filesystem-dev libboost-chrono-dev \
            libboost-program-options-dev libboost-test-dev libboost-thread-dev \
            libdb++-dev libminiupnpc-dev libzmq3-dev libprotobuf-dev protobuf-compiler

      - name: Build
        run: |
          ./autogen.sh
          ./configure --without-gui --with-incompatible-bdb --disable-zmq --disable-tests
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragonchain-linux-x86_64
          path: |
            src/dragonchaind
            src/dragonchain-cli
            src/dragonchain-tx
          retention-days: 30

  build-windows:
    name: Windows (x86_64, MinGW)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 g++-mingw-w64-x86-64-posix python3
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: depends/built
          key: depends-mingw32-${{ hashFiles('depends/packages/*.mk') }}

      - name: Build dependencies (depends)
        run: make -C depends HOST=x86_64-w64-mingw32 -j$(nproc) NO_QT=1

      - name: Configure
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site \
            ./configure --prefix=$PWD/depends/x86_64-w64-mingw32 \
            --disable-shared --without-gui --disable-zmq --disable-tests

      - name: Build
        run: make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragonchain-windows-x86_64
          path: |
            src/dragonchaind.exe
            src/dragonchain-cli.exe
            src/dragonchain-tx.exe
          retention-days: 30

  build-macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install automake libtool boost miniupnpc openssl pkg-config libevent berkeley-db@4

      - name: Build
        run: |
          ./autogen.sh
          export BDB_CFLAGS="-I$(brew --prefix berkeley-db@4)/include"
          export BDB_LIBS="-L$(brew --prefix berkeley-db@4)/lib -ldb_cxx-4.8"
          export BOOST_ROOT="$(brew --prefix boost)"
          ./configure --without-gui --with-incompatible-bdb --disable-zmq --disable-tests \
            --with-boost="$BOOST_ROOT" \
            CPPFLAGS="$BDB_CFLAGS" LDFLAGS="$BDB_LIBS"
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragonchain-macos-arm64
          path: |
            src/dragonchaind
            src/dragonchain-cli
            src/dragonchain-tx
          retention-days: 30

  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          for d in */; do
            tar -czf "${d%/}.tar.gz" "$d"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
