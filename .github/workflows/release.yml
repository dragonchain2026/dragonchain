name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build and release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
      tag:
        description: 'Release tag name (e.g. v0.6.2) — required for manual dispatch'
        required: false
        default: ''

jobs:
  build-linux:
    name: Linux (x86_64)
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 libssl-dev libevent-dev \
            libboost-system-dev libboost-filesystem-dev libboost-chrono-dev \
            libboost-program-options-dev libboost-test-dev libboost-thread-dev \
            libdb++-dev libminiupnpc-dev libzmq3-dev libprotobuf-dev protobuf-compiler \
            qtbase5-dev qt5-qmake libqt5gui5 qttools5-dev-tools

      - name: Build
        run: |
          ./autogen.sh
          ./configure --with-gui=qt5 --with-incompatible-bdb --disable-zmq --disable-tests
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragonchain-linux-x86_64
          path: |
            src/dragonchaind
            src/dragonchain-cli
            src/dragonchain-tx
            src/qt/dragonchain-qt
          retention-days: 30

  build-windows:
    name: Windows (x86_64, MinGW)
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 g++-mingw-w64-x86-64-posix python3
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: depends/built
          key: depends-mingw32-qt515-${{ hashFiles('depends/packages/*.mk') }}

      - name: Build dependencies (depends)
        run: make -C depends HOST=x86_64-w64-mingw32 -j$(nproc)

      - name: Configure
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site \
            ./configure --prefix=$PWD/depends/x86_64-w64-mingw32 \
            --disable-shared --with-gui=qt5 --disable-zmq --disable-tests \
            || { echo "=== config.log qwindows link ==="; grep -n -A25 "conftest.*qwindows\|-lqwindows" config.log | tail -80; exit 1; }

      - name: Build
        run: make -j$(nproc)

      - name: Collect MinGW runtime DLLs
        run: |
          mkdir -p deploy
          # Prefer the posix toolchain's runtime DLLs (matches the posix gcc/g++ selected above)
          find /usr/lib/gcc/x86_64-w64-mingw32 -path '*-posix*' -name 'libgcc_s_seh-1.dll' -exec cp -f {} deploy/ \;
          find /usr/lib/gcc/x86_64-w64-mingw32 -path '*-posix*' -name 'libstdc++-6.dll'    -exec cp -f {} deploy/ \;
          find /usr/x86_64-w64-mingw32      -name 'libwinpthread-1.dll'   -exec cp -f {} deploy/ \;
          cp src/dragonchaind.exe src/dragonchain-cli.exe src/dragonchain-tx.exe src/qt/dragonchain-qt.exe deploy/
          ls -la deploy/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragonchain-windows-x86_64
          path: deploy/*
          retention-days: 30

  build-macos:
    name: macOS (arm64)
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos'
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install automake libtool boost miniupnpc openssl pkg-config libevent berkeley-db@5 qt@5 protobuf@21

      - name: Build
        run: |
          ./autogen.sh
          export BDB_CFLAGS="-I$(brew --prefix berkeley-db@5)/include"
          export BDB_LIBS="-L$(brew --prefix berkeley-db@5)/lib -ldb_cxx-5.3"
          export BOOST_ROOT="$(brew --prefix boost)"
          export QT5_PREFIX="$(brew --prefix qt@5)"
          export PROTOBUF_PREFIX="$(brew --prefix protobuf@21)"
          export PKG_CONFIG_PATH="$QT5_PREFIX/lib/pkgconfig:$PROTOBUF_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          # boost >= 1.69 makes boost_system header-only (no libboost_system file),
          # but the old AX_BOOST_SYSTEM macro still searches for the library.
          # Create an empty archive so the check passes (header-only needs no link).
          if [ ! -f "$BOOST_ROOT/lib/libboost_system.a" ]; then
            echo '' | cc -x c -c -o /tmp/empty.o -
            ar rcs "$BOOST_ROOT/lib/libboost_system.a" /tmp/empty.o
          fi
          ./configure --with-gui=qt5 --with-incompatible-bdb --disable-zmq --disable-tests \
            --with-boost="$BOOST_ROOT" \
            CPPFLAGS="$BDB_CFLAGS" LDFLAGS="$BDB_LIBS"
          make -j$(sysctl -n hw.ncpu)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragonchain-macos-arm64
          path: |
            src/dragonchaind
            src/dragonchain-cli
            src/dragonchain-tx
            src/qt/dragonchain-qt
          retention-days: 30

  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      always() &&
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::tag is required for manual dispatch"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          for d in */; do
            tar -czf "${d%/}.tar.gz" "$d"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          tag_name: ${{ steps.tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
